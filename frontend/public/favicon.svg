<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Wallet Body Gradient -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Wallet Flap Gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>

    <!-- Leaf 1 Gradient (Growth) -->
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Leaf 2 Gradient (Growth) -->
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>

    <!-- Receipt Shadow -->
    <filter id="receiptShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Background Squircle with Glow -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="6" y="6" width="108" height="108" rx="30" stroke="rgba(192, 132, 252, 0.4)" stroke-width="2" />

  <!-- 2. Receipt / Document (peeking out top of wallet) -->
  <g filter="url(#receiptShadow)">
    <rect x="36" y="20" width="48" height="36" rx="8" fill="#ffffff" />
    <!-- Receipt text placeholder lines -->
    <line x1="46" y1="29" x2="74" y2="29" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="37" x2="66" y2="37" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 3. Wallet Body -->
  <rect x="18" y="38" width="84" height="60" rx="16" fill="url(#walletGrad)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5" />

  <!-- Wallet Inner Highlight -->
  <path d="M 22 46 C 22 42, 26 40, 32 40 L 88 40 C 94 40, 98 42, 98 46" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- 4. Wallet Clasp Flap on the right -->
  <path d="M 72 50 L 98 50 C 103 50, 106 53, 106 58 L 106 66 C 106 71, 103 74, 98 74 L 72 74 Z" fill="url(#flapGrad)" stroke="rgba(216, 180, 254, 0.4)" stroke-width="1.2" />
  <!-- Clasp Metallic Button -->
  <circle cx="94" cy="62" r="5.5" fill="#f8fafc" stroke="#c084fc" stroke-width="1.5" />
  <circle cx="94" cy="62" r="2.5" fill="#a855f7" />

  <!-- 5. Indian Rupee Symbol (₹) on Wallet Front -->
  <g fill="#ffffff">
    <!-- Top Horizontal Line -->
    <rect x="38" y="52" width="22" height="3" rx="1.5" />
    <!-- Second Horizontal Line -->
    <rect x="38" y="58" width="22" height="3" rx="1.5" />
    <!-- Upper Loop & Stem -->
    <path d="M 44 52 L 44 68 C 50 68, 54 66, 54 60 C 54 54, 49 52, 44 52 Z" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" fill="none" />
    <!-- Downward Diagonal Leg -->
    <path d="M 44 66 L 56 82" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 6. Growth Leaves (Savings / Prosperity) -->
  <!-- Left Leaf -->
  <path d="M 68 84 C 68 70, 78 62, 88 64 C 88 74, 82 84, 68 84 Z" fill="url(#leafGrad1)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" />
  <!-- Right Leaf -->
  <path d="M 82 86 C 82 72, 94 62, 104 64 C 104 76, 96 86, 82 86 Z" fill="url(#leafGrad2)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1" />
</svg>
